# ============================================
# Configuracion del AI News Agent
# ============================================

# --- Fuentes RSS ---
rss_feeds:
  - name: "TechCrunch AI"
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
  - name: "The Verge AI"
    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
  - name: "MIT Technology Review"
    url: "https://www.technologyreview.com/feed/"
  - name: "Google AI Blog"
    url: "https://blog.google/technology/ai/rss/"
  - name: "OpenAI Blog"
    url: "https://openai.com/blog/rss.xml"
  - name: "Ars Technica"
    url: "https://feeds.arstechnica.com/arstechnica/technology-lab"
  - name: "HuggingFace Blog"
    url: "https://huggingface.co/blog/feed.xml"
  - name: "Import AI Newsletter"
    url: "https://importai.substack.com/feed"

# --- Reddit subreddits (se agrega .rss automaticamente) ---
reddit_subreddits:
  - "https://www.reddit.com/r/MachineLearning/hot/.rss"
  - "https://www.reddit.com/r/LocalLLaMA/hot/.rss"
  - "https://www.reddit.com/r/artificial/hot/.rss"
  - "https://www.reddit.com/r/singularity/hot/.rss"

# --- Hacker News ---
hackernews:
  top_n: 30
  keywords:
    - "AI"
    - "LLM"
    - "GPT"
    - "Claude"
    - "machine learning"
    - "neural"
    - "startup"
    - "YC"
    - "funding"
    - "launch"
    - "Anthropic"
    - "OpenAI"
    - "Google AI"
    - "Meta AI"

# --- ArXiv ---
arxiv:
  categories:
    - "cs.AI"
    - "cs.LG"
    - "cs.CL"
  max_results: 10

# --- Apify (X/Twitter) ---
apify:
  search_terms:
    - "AI news"
    - "LLM release"
    - "startup funding"
    - "tech launch"
  max_tweets: 50

# --- Influencers ---
influencers:
  rss_feeds:
    - name: "Matt Wolfe (YouTube)"
      url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCJIfeSCssxSC_Dhc5s7woww"
      platform: "youtube"
    - name: "Fireship"
      url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCsBjURrPoezykLs9EqgamOA"
      platform: "youtube"
    - name: "Two Minute Papers"
      url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCbfYPyITQ-7l4upoX8nvctg"
      platform: "youtube"
    - name: "Yannic Kilcher"
      url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCZHmQk67mSJgfCCTn7xBfew"
      platform: "youtube"
    - name: "Andrej Karpathy"
      url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCXUPKJO5MZQN11PqgIvyuvQ"
      platform: "youtube"

  twitter_handles:
    - "@karpathy"
    - "@DrJimFan"
    - "@svpino"
    - "@AndrewYNg"
    - "@ylecun"
    - "@sama"

# --- Ranking ---
ranking:
  recency_bonus_hours: 6
  recency_multiplier: 2.0
  cross_mention_bonus: 1.5
  hn_score_threshold: 100
  high_value_keywords:
    - "launch"
    - "release"
    - "funding"
    - "open source"
    - "breakthrough"
    - "raises"
    - "billion"
    - "million"
    - "acquired"
    - "announced"
  high_value_multiplier: 1.3
  weights:
    trending: 0.4
    virality: 0.4
    influencer_signal: 0.2
  top_n: 10

# --- Viralidad ---
virality:
  positive_factors:
    controversial:
      score: 15
      keywords:
        - "replace"
        - "kill"
        - "destroy"
        - "ban"
        - "regulate"
        - "job loss"
        - "layoff"
        - "vs"
        - "better than"
        - "beats"
        - "obsolete"
        - "dangerous"
        - "risk"
        - "threat"
    relatable:
      score: 20
      keywords:
        - "you"
        - "your"
        - "everyone"
        - "anyone"
        - "free"
        - "how to"
        - "guide"
        - "tutorial"
        - "easy"
        - "simple"
        - "beginner"
        - "no code"
    novelty:
      score: 15
      keywords:
        - "launch"
        - "release"
        - "new"
        - "first"
        - "announce"
        - "introduce"
        - "unveil"
        - "debut"
        - "funding"
        - "raises"
        - "just released"
    data_driven:
      score: 10
      keywords:
        - "benchmark"
        - "percent"
        - "%"
        - "billion"
        - "million"
        - "x faster"
        - "outperform"
        - "record"
        - "study"
        - "research shows"
    trending_english:
      score: 25
      keywords: []  # Se detecta por menciones cruzadas, no por keywords
    simple_explainer:
      score: 10
      keywords:
        - "explained"
        - "what is"
        - "introduction"
        - "basics"
        - "101"
        - "understand"
        - "simple"
    sf_angle:
      score: 5
      keywords:
        - "San Francisco"
        - "Silicon Valley"
        - "Bay Area"
        - "YC"
        - "Y Combinator"
        - "Stanford"
        - "Berkeley"
  negative_factors:
    too_technical:
      score: -15
      keywords:
        - "theorem"
        - "proof"
        - "convergence"
        - "gradient descent"
        - "backpropagation"
        - "loss function"
        - "hyperparameter"
        - "epoch"
        - "batch normalization"
    saturated_spanish:
      score: -20
      keywords: []  # Mejora futura: detectar saturacion en español
    requires_context:
      score: -10
      keywords:
        - "part 2"
        - "continued"
        - "follow up"
        - "update on"
        - "previously"
    minor_update:
      score: -10
      keywords:
        - "patch"
        - "hotfix"
        - "minor"
        - "bugfix"
        - "maintenance"
        - "v0."
        - "point release"

# --- Prioridad de fuentes (para deduplicacion) ---
source_priority:
  "TechCrunch AI": 1
  "The Verge AI": 2
  "MIT Technology Review": 3
  "Anthropic Blog": 4
  "OpenAI Blog": 5
  "Ars Technica": 6
  "TLDR AI Newsletter": 7
  "The Batch (Andrew Ng)": 8
  "Hacker News": 9
  "Reddit": 10
  "ArXiv": 11
  "X/Twitter": 12

# --- LLM ---
llm:
  model: "claude-sonnet-4-20250514"
  max_tokens: 4096
